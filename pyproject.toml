[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aura-link"
version = "0.1.0"
description = "Open-source desktop agent transport, orchestration, inference and avatar framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "pillow>=10,<12",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pyyaml>=6,<7",
  "websockets>=13,<16",
]

[project.optional-dependencies]
client = [
  "mss>=9,<11",
  "PyQt6>=6.7,<7",
  "sounddevice>=0.5,<1",
  "silero-vad>=5.1,<7",
]
server = ["faster-whisper>=1.1,<2"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["aura_link", "client", "router", "server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

